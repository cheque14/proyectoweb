{% load static %}
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Canaco{% endblock %}</title>
<link rel="shortcut icon" href="{% static 'favicon.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/canaco-theme.css' %}">
<link rel="stylesheet" href="{% static 'css/canaco-redesign.css' %}">
{% block extra_css %}{% endblock extra_css %}
</head>
<body>{% include "partials/header.html" %}
<main id="main" class="panel-shell">
<div class="container">
<div class="panel-layout">
{% include "partials/sidebar.html" %}
<main class="panel-content flex-fill">
{% block content %}
{% endblock %}
</main>
</div>
</div>
</main>
{% include "partials/footer.html" %}
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
{% block extra_js %}{% endblock extra_js %}
</body>
</html>

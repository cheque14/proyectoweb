{% load static %}
<!doctype html>
<html lang="es">
<head>
  
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-NLF8XB2W"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>

 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <link rel="shortcut icon" href="{% static 'favicon.png' %}">
 <meta name="description" content="Noticias, historias y actividad empresarial de Canaco." />
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

 <link rel="stylesheet" href="{% static 'css/style.css' %}">
 <link rel="stylesheet" href="{% static 'css/canaco-theme.css' %}">
 <link rel="stylesheet" href="{% static 'css/canaco-redesign.css' %}">
 <title>{% block title %}Canaco{% endblock %}</title>
</head>
<body>

 {% include 'partials/header.html' %}
 {% block content %}
 {% endblock content %}
 {% include 'partials/footer.html' %}
 <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
 {% block extra_js %}{% endblock extra_js %}

</html>
